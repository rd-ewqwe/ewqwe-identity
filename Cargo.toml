[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Bruno Grieder <bruno.grieder@eqwwe.com>"]
license = "BUSL-1.1" # "Business Source License 1.1" # "Business Source License 1.1"
license-file = "LICENSE"
repository = ""
description = "ewQwe Identity"

[workspace]
members = ["credential_verifier", "crates/logging", "crates/openid4vp", "crates/ewqwe-digital-identity", "crates/ewqwe-digital-credential", "crates/ewqwe-verifier-app"]
resolver = "2"

[workspace.dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.10"
actix-identity = "0.9"
actix-service = "2.0.3"
actix-tls = "3.5.0"
actix-web = "4.13"
alcoholic_jwt = "4091"
base64 = "0.22"
ciborium = "0.2"
coset = "0.3"
jsonwebtoken = "9"
assert_matches = "1.5.0"
async-trait = "0.1"
bb8-redis = "0.24.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", default-features = false }
color-eyre = "0.6.5"
cookie_store = "0.22.0"
derive_builder = "0.20.2"
derive_more = "2.0"
enum_dispatch = "0.3.13"
ewqwe_digital_credential = { path = "crates/ewqwe-digital-credential", default-features = false }
ewqwe_digital_identity = { path = "crates/ewqwe-digital-identity", default-features = false }
ewqwe_logging = { path = "crates/logging" }
ewqwe_openid4vp = { path = "crates/openid4vp" }
ewqwe_verifier_app = { path = "crates/ewqwe-verifier-app" }
eyre = "0.6.12"
futures = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
humantime = "2.1.0"
humantime-serde = "1.1.1"
iso8601 = { version = "0.6", features = ["serde"] }
itertools = "0.14.0"
opentelemetry = { version = "0.29"}
opentelemetry-otlp = { version = "0.29"}
opentelemetry-semantic-conventions = { version = "0.29"}
opentelemetry-stdout = { version = "0.29"}
opentelemetry_sdk = { version = "0.29", default-features = false}
openssl = { version = "0.10.76" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9.2"
redis = { version = "0.32.6", features = ["aio", "tokio-comp", "bb8"] }
reqwest = { version = "0.13.1", default-features = false }
# rustls = "0.23.35"
seq-macro = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
serial_test = "3.2.0"
sha2 = "0.10.8"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres","sqlite","mysql","chrono"
], default-features = false }
strum = { version = "0.26.3", features = ["derive"] }
syslog-tracing = { version = "0.3" }
thiserror = "2.0.11"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-opentelemetry = { version = "0.30" }
tracing-subscriber = { version = "0.3", default-features = false }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2"
actix-session = { version = "0.10", features = ["cookie-session"] }
argon2 = "0.5"
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
