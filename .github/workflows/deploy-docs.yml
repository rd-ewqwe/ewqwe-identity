name: Deploy Documentation

on:
  push:
    branches:
      - main # Change to master if your default branch is named master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache mdbook-mermaid
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-mermaid-${{ hashFiles('**/book.toml') }}

      - name: Install mdbook-mermaid Preprocessor
        run: |
          if ! command -v mdbook-mermaid &> /dev/null; then
            cargo install mdbook-mermaid
          fi
          # Add the cargo binary path to the global environment PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Documentation Site
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
