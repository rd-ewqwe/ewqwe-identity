name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the cargo-audit binary and advisory database.
      # The binary is tiny (~5 MB); the DB is ~30 MB and is
      # incrementally updated by `cargo audit` on each run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}-v1

      - name: Install cargo-audit (cached)
        run: |
          mkdir -p ~/.cargo/bin
          if ! command -v cargo-audit &>/dev/null; then
            curl -sSfL https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz | tar xz -C ~/.cargo/bin
            chmod +x ~/.cargo/bin/cargo-audit
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run audit
        run: cargo audit

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
        working-directory: typescript
      - run: pnpm audit
        working-directory: typescript
