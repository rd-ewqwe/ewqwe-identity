version: 2

updates:
  # Rust workspace dependencies, resolved through the root Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The verifier app UI is a separate npm project with its own lockfile.
  - package-ecosystem: npm
    directory: /crates/ewqwe-credential-verifier-ui/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
