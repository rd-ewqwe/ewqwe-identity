# Container default configuration for the ewQwe Credential Verifier.
#
# Environment variables are substituted at runtime by the entrypoint script.
# Mount a full config at /data/credential-server.toml to override everything.

host_name = "0.0.0.0"
host_port = 9888

# Logging filter (overrides RUST_LOG env var at process level).
# Override with the RUST_LOG environment variable.
# rust_log = "info,ewqwe_credential_verifier_server=debug"

# Public URL reachable from wallets.
# Override with the PUBLIC_ROOT_URL environment variable.
# public_root_url = "https://verifier.example.com"

# Certificate authorities trusted to verify credential issuer chains.
# Mount your issuers_cas directory at /data/certificates/issuers_cas/,
# or override this path with a custom location.
issuers_cas_dir = "/data/certificates/issuers_cas"

# Signer certificate and key for attestation JWTs.
# The container includes development certificates at the path below.
# Override via SIGNER_CERT_PATH / SIGNER_KEY_PATH env vars to point at
# your own (e.g. Kubernetes Secrets mounted under /data/certificates/signer/).
attestation_issuer_certificate = "/usr/share/ewqwe/certificates/signer/ewqwe.signer.leaf.cert.pem"
attestation_issuer_key = "/usr/share/ewqwe/certificates/signer/ewqwe.signer.leaf.key.pem"

# Omit [tls_params] entirely for HTTP mode (default).
# Uncomment and configure for TLS:
# [tls_params]
# server_private_key = "/data/certificates/tls/server.key.pem"
# server_certificate = "/data/certificates/tls/server.cert.pem"
# server_ca_chain    = "/data/certificates/tls/ca.pem"
# client_ca_cert_chain = "/data/certificates/tls/ca.pem"

[openid4vp_config]
transaction_ttl_secs = 90

[openid4vp_config.transaction_store]
backend = "sqlite_file"
path = "/data/transactions.db"

[openid4vp_config.haip_config]
x509_cert_path = "/usr/share/ewqwe/certificates/signer/ewqwe.signer.leaf.fullchain.pem"
x509_key_path = "/usr/share/ewqwe/certificates/signer/ewqwe.signer.leaf.key.pem"

[journal_config]
enabled = true
backend = "sqlite_file"
path = "/data/journal.db"

[verifier_ui]
enabled = true
app_name = "ewQwe Verifier"
# session_secret auto-generated on each start when not set.
# Set via SESSION_SECRET env var or mount a full config.
# session_secret = "<64 hex chars>"
ui_dist_path = "/usr/share/ewqwe/ui/dist"

[verifier_ui.db]
backend = "sqlite_file"
path = "/data/verifier_ui.db"

[tracing_config]
# ANSI escape codes in log output.  Override with the ANSI_COLORS
# environment variable (set to "yes", "true", or "1" to enable).
with_ansi_colors = false
