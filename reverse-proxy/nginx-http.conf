# Temporary HTTP-only configuration used during initial certificate acquisition.
# nginx is started with this config so certbot can complete the ACME webroot challenge
# before the real TLS-enabled config is activated.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name ${DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "Acquiring TLS certificate, please wait...\n";
            add_header Content-Type text/plain;
        }
    }
}
