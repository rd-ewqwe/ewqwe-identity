[package]
name = "ewqwe_openid4vp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenID4VP Relying Party backend — transaction lifecycle, JAR signing, JWE decryption, DCQL query building"

[lib]
path = "src/lib.rs"


[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
openssl = { workspace = true, features = ["vendored"] }
qrcode = { workspace = true }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
