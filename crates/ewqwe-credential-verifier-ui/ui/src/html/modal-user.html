<!-- Create / Edit User Modal -->
<div id="modal-user" class="modal-bg hidden">
    <div class="glass modal-card p-7">
        <h3
            id="modal-user-title"
            class="text-lg font-bold mb-5"
            data-i18n="create_user"
        >
            Create User
        </h3>
        <form
            id="modal-user-form"
            onsubmit="submitUserModal(event)"
            class="flex flex-col gap-4"
        >
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label
                        class="block text-sm text-white/70 mb-1"
                        data-i18n="first_name"
                        >First Name</label
                    >
                    <input
                        id="mu-first"
                        type="text"
                        class="form-input"
                    />
                </div>
                <div>
                    <label
                        class="block text-sm text-white/70 mb-1"
                        data-i18n="last_name"
                        >Last Name</label
                    >
                    <input
                        id="mu-last"
                        type="text"
                        class="form-input"
                    />
                </div>
            </div>
            <div>
                <label
                    class="block text-sm text-white/70 mb-1"
                    data-i18n="email"
                    >Email</label
                >
                <input id="mu-email" type="email" class="form-input" />
            </div>
            <div id="mu-password-wrap">
                <label class="block text-sm text-white/70 mb-1">
                    <span data-i18n="password">Password</span>
                    <span class="text-white/40" data-i18n="min_chars"
                        >(min 12 chars)</span
                    >
                </label>
                <input
                    id="mu-password"
                    type="password"
                    minlength="12"
                    class="form-input"
                    placeholder="••••••••••••"
                />
            </div>
            <div>
                <label
                    class="block text-sm text-white/70 mb-1"
                    data-i18n="role"
                    >Role</label
                >
                <select id="mu-role" class="form-input">
                    <option value="verifier" data-i18n="role_verifier">
                        Verifier
                    </option>
                    <option value="admin" data-i18n="role_admin">
                        Admin
                    </option>
                </select>
            </div>
            <div id="mu-active-wrap" class="hidden items-center gap-2">
                <input
                    id="mu-active"
                    type="checkbox"
                    class="w-4 h-4 accent-brand-indigo"
                />
                <label
                    for="mu-active"
                    class="text-sm text-white/70"
                    data-i18n="active"
                    >Active</label
                >
            </div>
            <div>
                <label
                    class="block text-sm text-white/70 mb-1"
                    data-i18n="allowed_credential_types"
                >
                    Allowed Credential Types
                </label>
                <p
                    class="text-xs text-white/40 mb-2"
                    data-i18n="allowed_types_hint"
                >
                    Leave all unchecked to allow every type.
                </p>
                <div id="mu-cred-types" class="flex flex-wrap gap-3">
                    <label
                        class="flex items-center gap-1 text-sm text-white/70"
                    >
                        <input
                            type="checkbox"
                            value="france-identite-numerique"
                            class="mu-cred-cb w-4 h-4 accent-brand-indigo"
                        />
                        <span
                            data-i18n="france_identite_numerique"
                            aria-flowto="mu-cred-types"
                            >France Identité Numérique</span
                        >
                    </label>
                    <label
                        class="flex items-center gap-1 text-sm text-white/70"
                    >
                        <input
                            type="checkbox"
                            value="national-id"
                            class="mu-cred-cb w-4 h-4 accent-brand-indigo"
                        />
                        <span data-i18n="national_id"
                            >National ID (PID)</span
                        >
                    </label>
                    <label
                        class="flex items-center gap-1 text-sm text-white/70"
                    >
                        <input
                            type="checkbox"
                            value="mdl"
                            class="mu-cred-cb w-4 h-4 accent-brand-indigo"
                        />
                        <span data-i18n="mobile_drivers_license"
                            >Mobile Driver's License (mDL)</span
                        >
                    </label>
                    <label
                        class="flex items-center gap-1 text-sm text-white/70"
                    >
                        <input
                            type="checkbox"
                            value="proof-of-age"
                            class="mu-cred-cb w-4 h-4 accent-brand-indigo"
                        />
                        <span data-i18n="proof_of_age"
                            >Proof of Age</span
                        >
                    </label>
                </div>
            </div>
            <p id="mu-error" class="text-red-400 text-sm hidden"></p>
            <div class="flex gap-3 mt-1">
                <button
                    type="submit"
                    class="btn-primary flex-1"
                    data-i18n="save"
                >
                    Save
                </button>
                <button
                    type="button"
                    onclick="closeUserModal()"
                    class="btn-ghost flex-1"
                    data-i18n="cancel"
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
