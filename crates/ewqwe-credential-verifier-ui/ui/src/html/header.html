<!-- Top bar -->
<header
    class="glass m-3 mb-0 px-4 py-3 flex items-center gap-3 shrink-0"
>
    <!-- Mobile hamburger -->
    <button
        id="hamburger"
        onclick="openDrawer()"
        class="md:hidden text-white/70 hover:text-white mr-1"
    >
        <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
            />
        </svg>
    </button>
    <!-- Company logo + name in top bar -->
    <div class="flex items-center gap-2 flex-1">
        <img
            id="topbar-logo"
            src="/logo.png"
            alt="Logo"
            class="h-7 w-auto hidden"
        />
        <span
            id="topbar-app-name"
            class="font-bold text-base text-white"
            >Verifier App</span
        >
    </div>
    <!-- Desktop nav -->
    <nav
        id="topbar-nav"
        class="hidden md:flex items-center gap-1"
    ></nav>
</header>
