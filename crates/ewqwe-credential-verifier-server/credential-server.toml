# Credential Server Configuration used for testing and development.
host_name = "0.0.0.0"
host_port = 9443
default_username = "demo-user"

# Public root URL of this server, used when building wallet callback URIs
# (e.g. `response_uri` / `request_uri` in OpenID4VP flows generated by the
# Verifier App).
#/
# Set this when the server is behind a reverse proxy, NAT, or the bind
# address (`0.0.0.0`) differs from the address reachable by wallets.
#
# Example: `"https://demo.ewqwe.local:9443"` or `"https://verifier.example.com"`.
#
# Priority when building the QR code public URL:
#   1. `[verifier_ui].qr_code_callback_url` (most specific override)
#   2. This field (`public_root_url`)
#   3. URL inferred from the incoming HTTP request (last resort)
# Public URL reachable from the wallet.
public_root_url = "https://192.168.1.10:9443"

# Directory containing CA certificates used to verify credential issuer chains.
# All *.pem files in this directory are loaded as trusted CA anchors. The server
# loads this directory once at startup and caches it; restart the server to pick
# up any file additions/removals.
# Defaults to `issuers_cas/` next to the config file if not specified.
issuers_cas_dir = "../../certificates/issuers_cas"

# Issuer certificate for attestation JWTs.
# The certificate's Subject CN becomes the `iss` claim.
# Its public key (plus `kid` fingerprint) is served at
# GET /ewqwe_api/openid4vp/.well-known/jwks.json so the RP can verify attestations.
# Resolved relative to this config file. Defaults to tls_params.server_certificate.
attestation_issuer_certificate = "../../certificates/signer/ewqwe.signer.leaf.cert.pem"

# Path to the PEM private key used to sign attestation JWTs.
# Resolved relative to this config file. Defaults to tls_params.server_private_key.
attestation_issuer_key = "../../certificates/signer/ewqwe.signer.leaf.key.pem"

# If true, skip requiring client certificate authentication and use a default
# authenticated user for all requests.
disable_authentication = true

# Username to insert into request context when `disable_authentication=true`.
# Defaults to "test" when omitted.
disabled_authentication_user = "local_tests_user"

# Per crate/logging `TracingConfig`.
rust_log = "info,credential_verifier=debug,ewqwe_openid4vp=debug"


[tls_params]
server_private_key = "../../certificates/tls/ewqwe.server.key.pem"
server_certificate = "../../certificates/tls/ewqwe.server.cert.pem"
server_ca_chain = "../../certificates/tls/ewqwe.ca.pem"
client_ca_cert_chain = "../../certificates/tls/ewqwe.ca.pem"

[openid4vp_config]
transaction_ttl_secs = 300

# Transaction store backend. Omit this section to use the default (SQLite in-memory).
#
# SQLite in-memory (default — no persistence, suitable for single-instance deployments):
[openid4vp_config.transaction_store]
# backend = "sqlite_memory"
#
# SQLite file (persists across restarts, suitable for single-instance deployments):
# [openid4vp_config.transaction_store]
backend = "sqlite_file"
path = "transactions.db"
#
# PostgreSQL (recommended for multi-instance / high-availability deployments):
# [openid4vp_config.transaction_store]
# backend = "postgres"
# url     = "postgres://ewqwe:ewqwe@localhost/ewqwe"
#
# Redis (TTL-native expiry — no cleanup thread, suitable for distributed deployments):
# [openid4vp_config.transaction_store]
# backend = "redis"
# url     = "redis://127.0.0.1:6379"


[openid4vp_config.haip_config]
# HAIP profile to use when requesting credentials from the wallet.
# Required for HAIP profiles, ignored for non-HAIP profiles.
x509_cert_path = "../../certificates/signer/ewqwe.signer.leaf.fullchain.pem"
x509_key_path = "../../certificates/signer/ewqwe.signer.leaf.key.pem"

# ─── Verification Journal ──────────────────────────────────────────────────────
#
# Append-only, hash-chained audit log of every successful verification event.
# Each entry records the authenticated username, credential metadata, and a
# SHA-256 hash linking it to the previous entry in that user's chain.
#
# The journal is disabled by default.  Enable it by un-commenting one of the
# sections below and setting `enabled = true`.
#
# SQLite in-memory (no persistence — useful for development / smoke tests):
# [journal_config]
# enabled = true
# backend = "sqlite_memory"
#
# SQLite file (single-instance, persists across restarts):
[journal_config]
enabled = true
backend = "sqlite_file"
path = "journal.db"
#
# PostgreSQL (recommended for HA / multi-instance deployments):
# [journal_config]
# enabled = true
# backend = "postgres"
# url     = "postgres://ewqwe:ewqwe@localhost/ewqwe"

# ─── Verifier UI ─────────────────────────────────────────────────────────────
#
# Embedded web UI application that lets admin-managed "verifier" users generate
# QR codes for credential verification via OpenID4VP (EU Annex-A age-over-18,
# mobile driver's licence, national ID / PID).
#
# The API is served under /api/v1/* and the SPA is served from the root URL /.
# Disabled by default.
#
[verifier_ui]
enabled = true
# Display name shown in the browser tab and header. Default: "Verifier App"
app_name = "Test Verifier"

# URL for a custom logo image displayed in the header.
# logo_url = "https://example.com/logo.png"

# Hex-encoded session secret (≥32 bytes = ≥64 hex chars).
# When omitted a random key is used — sessions are lost on server restart.
session_secret = "test server secret"

# Public URL used as the QR code callback URLs that will be called
# by the wallet in order to obtain the authorization request.
#
# This will default to the `public_root_url` set on the credential
# verifier server and there little reason to set it manually.
# qr_code_callback_url = "https://id.demo.ewqwe.eu:4043"

# Restrict which credential types can be requested from this server instance.
# Values: "proof-of-age", "mdl", "national-id".
# An empty list (or omitting this key) allows all types.
# allowed_credential_types = ["proof-of-age"]

# Path to the Vite-built UI assets directory.
# Run `deno task build` in crates/ewqwe-verifier-app/ui/ to populate this directory.
# Relative paths are resolved from the directory containing this config file.
ui_dist_path = "../crates/ewqwe-verifier-app/ui/dist"

[verifier_ui.db]
# Database backend for user accounts (default: sqlite_memory):
# backend = "sqlite_memory"       # no persistence — dev/testing only
backend = "sqlite_file"
path = "verifier_ui.db"
# backend = "postgres"
# url     = "postgres://ewqwe:ewqwe@localhost/ewqwe"
# backend = "mysql"
# url     = "mysql://ewqwe:ewqwe@localhost/ewqwe"
