[package]
name = "ewqwe_credential_verifier_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
repository.license = true
description = "Rust client library for the ewQwe Digital Credential Verification API — OpenID4VP, DCQL, credential verification"
readme = "README.md"
keywords = ["openid4vp", "age-verification", "digital-identity", "dcql", "eudi"]
categories = ["authentication", "api-bindings", "web-programming::http-client"]

[lib]
path = "src/lib.rs"


[dependencies]
async-trait = { workspace = true }
ewqwe_openid4vp = { workspace = true }
reqwest = { workspace = true , features = ["json", "rustls"] }
serde = { workspace = true , features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true , features = ["full", "macros"] }
mockito = { workspace = true }
serde_json = { workspace = true }
