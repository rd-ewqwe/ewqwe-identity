[package]
name = "ewqwe_logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry-otlp = { workspace = true, features = [
    "trace",
    "metrics",
    "integration-testing",
    "grpc-tonic",
] }
opentelemetry-semantic-conventions = { workspace = true, features = [
    "semconv_experimental",
] }
opentelemetry-stdout = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { workspace = true, default-features = false, features = [
    "trace",
] }
syslog-tracing = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
