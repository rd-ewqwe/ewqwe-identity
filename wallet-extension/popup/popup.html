<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU Age Verification Wallet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-96 min-h-96">
  <!-- Header -->
  <header class="header-gradient text-white p-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
        </svg>
        <h1 class="text-lg font-bold">EU AV Wallet</h1>
      </div>
      <button id="reset-btn" class="text-xs opacity-75 hover:opacity-100" title="Reset to sample credentials">
        ↻ Reset
      </button>
    </div>
    <p class="text-xs opacity-75 mt-1">Digital Credentials for Age Verification</p>
  </header>

  <!-- Credential Summary -->
  <div id="summary" class="p-3 bg-white\/10 border-b">
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="summary-card blue">
        <div id="count-mdl" class="text-lg font-bold text-blue-400">0</div>
        <div class="text-gray-400">mDL</div>
      </div>
      <div class="summary-card green">
        <div id="count-pid" class="text-lg font-bold text-green-400">0</div>
        <div class="text-gray-400">PID</div>
      </div>
      <div class="summary-card purple">
        <div id="count-poa" class="text-lg font-bold text-purple-400">0</div>
        <div class="text-gray-400">Proof of Age</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex border-b bg-white\/5">
    <button class="tab-btn flex-1 py-2 text-sm font-medium active" data-tab="all">
      All
    </button>
    <button class="tab-btn flex-1 py-2 text-sm font-medium" data-tab="mdl">
      mDL
    </button>
    <button class="tab-btn flex-1 py-2 text-sm font-medium" data-tab="national-id">
      PID
    </button>
    <button class="tab-btn flex-1 py-2 text-sm font-medium" data-tab="proof-of-age">
      Age
    </button>
  </div>

  <!-- Credentials List -->
  <div id="credentials-list" class="p-3 space-y-2 max-h-80 overflow-y-auto">
    <!-- Credentials will be rendered here -->
  </div>

  <!-- Empty State -->
  <div id="empty-state" class="hidden p-8 text-center text-gray-400">
    <svg class="w-12 h-12 mx-auto mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
    </svg>
    <p class="text-sm">No credentials in wallet</p>
    <button id="load-samples-btn" class="mt-3 text-xs text-indigo-400 hover:underline">
      Load sample credentials
    </button>
  </div>

  <!-- Footer -->
  <footer class="p-3 bg-white\/5 border-t text-center">
    <p class="text-xs text-gray-400">
      <a href="https://ageverification.dev" target="_blank" class="text-indigo-400 hover:underline">
        EU Age Verification
      </a>
      • v0.1.0
    </p>
  </footer>

  <!-- Credential Detail Modal -->
  <div id="credential-modal" class="hidden fixed inset-0 bg-black\/50 flex items-center justify-center p-4">
    <div class="modal-container w-full max-w-sm max-h-96 overflow-hidden">
      <div id="modal-header" class="modal-header p-4">
        <h2 id="modal-title" class="font-bold text-white">Credential Details</h2>
        <p id="modal-issuer" class="text-sm text-purple-200"></p>
      </div>
      <div id="modal-content" class="p-4 overflow-y-auto max-h-60">
        <!-- Claims will be rendered here -->
      </div>
      <div class="modal-footer p-3 flex justify-end gap-2">
        <button id="modal-close" class="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-500 rounded">
          Close
        </button>
        <button id="modal-delete" class="px-4 py-2 text-sm bg-red-600 text-white hover:bg-red-700 rounded">
          Delete
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
