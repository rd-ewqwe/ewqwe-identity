# Credential Server Configuration used for testing and development. 
host_name = "0.0.0.0"
host_port = 9443
default_username = "demo-user"

# Trusted credential-issuer CA certificates.
# Credentials whose signing certificate chains to one of these CAs are
# considered trustworthy. Paths are resolved relative to this config file.
# Keep this list at the TOML root level; if it is placed after a table header
# such as [openid4vp_config.haip_config], TOML will treat it as belonging to
# that table and ServerParams.trusted_issuer_certs will remain empty.
trusted_issuer_certs = [
    "src/tests/certificates/trusted_issuers/av_issuer_ca01.pem",
    "src/tests/certificates/trusted_issuers/dc4eu.pem",
    "src/tests/certificates/trusted_issuers/isrg_root_x1.pem",
    "src/tests/certificates/trusted_issuers/isrg_root_x2.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_cz.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_ee.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_eu.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_lu.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_nl.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_pt.pem",
    "src/tests/certificates/trusted_issuers/pidissuerca02_ut.pem",
    "src/tests/certificates/trusted_issuers/r45_staging.pem",
]

[tls_params]
server_private_key = "src/tests/certificates/ec/ewqwe.server.key.pem"
server_certificate = "src/tests/certificates/ec/ewqwe.server.cert.pem"
server_ca_chain = "src/tests/certificates/ec/ewqwe.chain.pem"
client_ca_cert_chain = "src/tests/certificates/ec/ewqwe.chain.pem"

[openid4vp_config]
transaction_ttl_secs = 300

# Transaction store backend. Omit this section to use the default (SQLite in-memory).
#
# SQLite in-memory (default — no persistence, suitable for single-instance deployments):
# [openid4vp_config.transaction_store]
# backend = "sqlite_memory"
#
# SQLite file (persists across restarts, suitable for single-instance deployments):
# [openid4vp_config.transaction_store]
# backend = "sqlite_file"
# path    = "/var/lib/ewqwe/transactions.db"
#
# PostgreSQL (recommended for multi-instance / high-availability deployments):
# [openid4vp_config.transaction_store]
# backend = "postgres"
# url     = "postgres://user:pass@localhost/ewqwe"
#
# Redis (TTL-native expiry — no cleanup thread, suitable for distributed deployments):
# [openid4vp_config.transaction_store]
# backend = "redis"
# url     = "redis://127.0.0.1:6379"



[openid4vp_config.haip_config]
x509_cert_path = "src/tests/certificates/ec/ewqwe.server.fullchain.pem"
x509_key_path = "src/tests/certificates/ec/ewqwe.server.key.pem"